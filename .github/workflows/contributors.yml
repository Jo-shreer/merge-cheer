name: Contributors

# Protected main refuses a GITHUB_TOKEN push (GH006). Offer the
# refresh as a pull request instead of failing the job.

on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - uses: YauhenBichel/readme-contributors@dde1d84bb305e531a8f923263791b0767a6bdd7c # v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the list
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          # Ubuntu git is case-sensitive. Do not add README or readme.md:
          # those paths do not exist here and `git add` exits 128.
          git add README.md .github/contributors.svg
          git diff --cached --quiet && exit 0
          git commit -m "docs: refresh README contributors"
          git checkout -B docs/contributors
          git push --force --set-upstream origin docs/contributors
          NUMBER="$(gh pr list --head docs/contributors --state open --json number -q '.[0].number')"
          if [ -z "$NUMBER" ]; then
            gh pr create --base "$DEFAULT_BRANCH" --head docs/contributors \
              --title "docs: refresh README contributors" \
              --body "The contributors list changed. Opened because main takes changes only through a pull request."
          fi
