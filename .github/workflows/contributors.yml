name: Contributors

# Protected main refuses a GITHUB_TOKEN push (GH006). Offer the
# refresh as a pull request instead of failing the job. If Actions
# cannot create PRs, leave docs/contributors pushed and print the
# compare URL.

on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - uses: YauhenBichel/readme-contributors@dd5eb5b4251b0158662457256ca29c0de1e5444c # v1.5.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          format: html

      - name: Push the list
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          # Ubuntu git is case-sensitive and exits 128 on a missing
          # pathspec. format: html writes README.md and .github/faces;
          # it never writes .github/contributors.svg.
          git add README.md
          [ -d .github/faces ] && git add .github/faces
          [ -e .github/contributors.svg ] && git add .github/contributors.svg
          git diff --cached --quiet && exit 0
          git commit -m "docs: refresh README contributors"
          git checkout -B docs/contributors
          git push --force --set-upstream origin docs/contributors
          NUMBER="$(gh pr list --head docs/contributors --state open --json number -q '.[0].number')"
          if [ -z "$NUMBER" ]; then
            if ! CREATE_ERR="$(gh pr create --base "$DEFAULT_BRANCH" --head docs/contributors \
              --title "docs: refresh README contributors" \
              --body "The contributors list changed. Opened because main takes changes only through a pull request." 2>&1)"; then
              echo "$CREATE_ERR"
              if echo "$CREATE_ERR" | grep -Fq "GitHub Actions is not permitted to create or approve pull requests"; then
                echo "https://github.com/YauhenBichel/merge-cheer/compare/main...docs/contributors"
                exit 0
              fi
              exit 1
            fi
            echo "$CREATE_ERR"
          fi
