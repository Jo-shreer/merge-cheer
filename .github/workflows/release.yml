name: Release

# Marketplace-facing GitHub Release + Docker Hub pipe image.
#
# 1. Tests run on the exact tagged commit (never a pull request head).
# 2. Job `release` needs those tests and the `marketplace` environment.
#    The owner must add Required reviewers under
#    Settings → Environments → marketplace, or this job will not pause.
# 3. Job `docker` pushes <hub-user>/merge-cheer:<semver> after Release.
#    Requires secrets DOCKERHUB_USERNAME + DOCKERHUB_TOKEN.
# 4. GitHub has no API for the Marketplace checkbox. After release,
#    open the printed edit URL and tick Publish on the first listing only.
#
# Semver tags only (vMAJOR.MINOR.PATCH). This workflow never force-moves v1.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing semver tag to release (vMAJOR.MINOR.PATCH, for example v1.2.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Require a semver tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          echo "Releasing ${VERSION} (semver only; v1 is not a ship tag here)."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Tests
        run: python3 -m unittest discover -s tests -q

  release:
    needs: test
    environment: marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG="$VERSION"
          PREV="$(
            git tag --list --sort=-v:refname \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | grep -vx "$TAG" \
              | head -n1 || true
          )"
          {
            echo "Topic groups pick a GIF from the pull request title."
            echo "Zero-config: bundled G-rated GIFs, no Giphy key."
            echo
            if [ -n "$PREV" ]; then
              echo "## Changes since ${PREV}"
              echo
              git log --pretty=format:'- %s' "${PREV}..${TAG}"
              echo
            else
              echo "## Changes"
              echo
              git log --pretty=format:'- %s' "$TAG"
              echo
            fi
            echo
            echo "## Marketplace"
            echo
            echo "GitHub does not allow a fully unattended first-time Marketplace"
            echo "publish. After this reviewed Release exists, open"
            echo
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/edit/${TAG}"
            echo
            echo "and tick **Publish this Action to the GitHub Marketplace** on the"
            echo "first listing only. Later releases update the listing if it is"
            echo "already published."
          } > "${RUNNER_TEMP}/notes.md"

          # Idempotent: a parallel create, manual publish, or re-run must not
          # fail the marketplace environment when the Release already exists.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Merge Cheer ${TAG}" \
              --notes-file "${RUNNER_TEMP}/notes.md"
            echo "Release ${TAG} already existed — notes updated."
          else
            gh release create "$TAG" \
              --title "Merge Cheer ${TAG}" \
              --notes-file "${RUNNER_TEMP}/notes.md" \
              --verify-tag
            echo "Created Release ${TAG}."
          fi

          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          echo "Marketplace edit: https://github.com/${GITHUB_REPOSITORY}/releases/edit/${TAG}"
          {
            echo "### Release ${TAG}"
            echo
            echo "Reviewed and published (create is idempotent if the tag"
            echo "Release already exists). Marketplace is still a browser tick"
            echo "on the first listing:"
            echo
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/edit/${TAG}"
          } >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Publish Docker Hub image
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve image tag
        id: ver
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image_tag=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Require Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "::error::Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets."
            echo "::error::USERNAME = Hub username, not email."
            echo "::error::TOKEN = Hub Access Token (Read & Write), not account password."
            exit 1
          fi
          # Catch accidental whitespace / newlines that break Authorization
          if [ "$DOCKERHUB_USERNAME" != "$(printf '%s' "$DOCKERHUB_USERNAME")" ] || \
             [ "$DOCKERHUB_TOKEN" != "$(printf '%s' "$DOCKERHUB_TOKEN")" ]; then
            echo "::error::DOCKERHUB_* secrets must not contain leading/trailing whitespace or newlines."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ver.outputs.tag }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/merge-cheer:${{ steps.ver.outputs.image_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/merge-cheer:latest
          provenance: false

      - name: Summary
        env:
          USER: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ steps.ver.outputs.image_tag }}
          GIT_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          {
            echo "### Docker Hub"
            echo
            echo "- \`${USER}/merge-cheer:${IMAGE_TAG}\`"
            echo "- \`${USER}/merge-cheer:latest\`"
            echo
            echo "Bitbucket: \`pipe: docker://${USER}/merge-cheer:${IMAGE_TAG}\`"
            echo
            echo "Source tag: \`${GIT_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
