name: Publish Docker

# Manual retry for the Bitbucket pipe image. Normal path is the `docker`
# job inside the Release workflow.
#
# Secrets: DOCKERHUB_USERNAME (Hub username, not email) and
# DOCKERHUB_TOKEN (Hub Access Token Read & Write — not account password).

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing semver tag (vMAJOR.MINOR.PATCH, for example v1.4.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-docker
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: ver
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image_tag=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Sanitize Docker Hub secrets
        id: hub
        env:
          RAW_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          RAW_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          # echo/gh secret set often leave a trailing newline → malformed Authorization
          USER="$(printf '%s' "${RAW_USER:-}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          TOKEN="$(printf '%s' "${RAW_TOKEN:-}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -z "$USER" ] || [ -z "$TOKEN" ]; then
            echo "::error::Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets."
            echo "::error::USERNAME = Hub username, not email."
            echo "::error::TOKEN = Hub Access Token (Read & Write), not account password."
            exit 1
          fi
          case "$USER" in
            *@*)
              echo "::error::DOCKERHUB_USERNAME looks like an email; use the Hub username."
              exit 1
              ;;
          esac
          echo "username_len=${#USER} token_len=${#TOKEN}"
          echo "::add-mask::$USER"
          echo "::add-mask::$TOKEN"
          echo "username=$USER" >> "$GITHUB_OUTPUT"
          {
            echo "DOCKERHUB_USERNAME=$USER"
            echo "DOCKERHUB_TOKEN=$TOKEN"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ver.outputs.tag }}
          persist-credentials: false

      - name: Tests
        run: python3 -m unittest discover -s tests -q

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to Docker Hub
        run: |
          set -euo pipefail
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.hub.outputs.username }}/merge-cheer:${{ steps.ver.outputs.image_tag }}
            ${{ steps.hub.outputs.username }}/merge-cheer:latest
          provenance: false

      - name: Summary
        env:
          USER: ${{ steps.hub.outputs.username }}
          IMAGE_TAG: ${{ steps.ver.outputs.image_tag }}
          GIT_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          {
            echo "### Docker Hub"
            echo
            echo "- \`${USER}/merge-cheer:${IMAGE_TAG}\`"
            echo "- \`${USER}/merge-cheer:latest\`"
            echo
            echo "Bitbucket consumers:"
            echo
            echo '```yaml'
            echo "script:"
            echo "  - pipe: docker://${USER}/merge-cheer:${IMAGE_TAG}"
            echo "    variables:"
            echo "      TOPIC: auto"
            echo "      BITBUCKET_ACCESS_TOKEN: \$BITBUCKET_ACCESS_TOKEN"
            echo '```'
            echo
            echo "Source tag: \`${GIT_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
