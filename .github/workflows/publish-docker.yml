name: Publish Docker

# Manual retry for the Bitbucket pipe image. Normal path is the `docker`
# job inside the Release workflow.
#
# Secrets: DOCKERHUB_USERNAME (Hub username, not email) and
# DOCKERHUB_TOKEN (Hub Access Token Read & Write — not account password).
# No trailing newline in either secret.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing semver tag (vMAJOR.MINOR.PATCH, for example v1.4.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-docker
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: ver
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image_tag=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Require Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "::error::Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets."
            echo "::error::USERNAME = Hub username (e.g. yauhenbichel), not email."
            echo "::error::TOKEN = Hub Access Token (Read & Write), not account password."
            exit 1
          fi
          if [ "$DOCKERHUB_USERNAME" != "$(printf '%s' "$DOCKERHUB_USERNAME")" ] || \
             [ "$DOCKERHUB_TOKEN" != "$(printf '%s' "$DOCKERHUB_TOKEN")" ]; then
            echo "::error::DOCKERHUB_* secrets must not contain leading/trailing whitespace or newlines."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ver.outputs.tag }}
          persist-credentials: false

      - name: Tests
        run: python3 -m unittest discover -s tests -q

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/merge-cheer:${{ steps.ver.outputs.image_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/merge-cheer:latest
          provenance: false

      - name: Summary
        env:
          USER: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ steps.ver.outputs.image_tag }}
          GIT_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          {
            echo "### Docker Hub"
            echo
            echo "- \`${USER}/merge-cheer:${IMAGE_TAG}\`"
            echo "- \`${USER}/merge-cheer:latest\`"
            echo
            echo "Bitbucket consumers:"
            echo
            echo '```yaml'
            echo "script:"
            echo "  - pipe: docker://${USER}/merge-cheer:${IMAGE_TAG}"
            echo "    variables:"
            echo "      TOPIC: auto"
            echo "      BITBUCKET_ACCESS_TOKEN: \$BITBUCKET_ACCESS_TOKEN"
            echo '```'
            echo
            echo "Source tag: \`${GIT_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
