name: Celebrate merge

# Live demo in the wild: comment a GIF on the next merge here.
# Checkout is the default branch only — never the pull request
# head — so `uses: ./` can load action.yml after a fork merge.
on:
  pull_request_target:
    types: [closed]

permissions:
  pull-requests: write

jobs:
  celebrate:
    if: github.event.pull_request.merged && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./
