# Same GIF as the zero-config job, plus one line about what merged.
# Settings → Secrets → Actions → New repository secret:
#   Name: OPENAI_API_KEY
#   Value: your OpenAI (or OpenAI-compatible) key
#
# Pin this SHA until the next Merge Cheer release. @v1.6.0 can call a
# model, but it still accepts a generic "Thanks {author}."

name: Celebrate merge
on:
  pull_request_target:
    types: [closed]
permissions:
  pull-requests: write
jobs:
  celebrate:
    if: github.event.pull_request.merged && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: YauhenBichel/merge-cheer@e183fbc7b8e395506e627ff60600577dfb5f8f45 # specific model lines
        with:
          model: gpt-4o-mini
          model-api-key: ${{ secrets.OPENAI_API_KEY }}
